name: API Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Download previous history for trends
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: Copy history to results
        run: |
          if [ -d "gh-pages-history/history" ]; then
            echo "📊 Copying history for trends..."
            mkdir -p target/allure-results/history
            cp -r gh-pages-history/history/* target/allure-results/history/ 2>/dev/null || true
          fi

      - name: Run tests and collect Allure results
        run: mvn clean test
        continue-on-error: true

      - name: Generate Allure HTML Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

  deploy-report:
    needs: api-tests
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Download previous history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-content
        continue-on-error: true

      - name: Preserve history for trends
        run: |
          if [ -d "gh-pages-content/history" ]; then
            echo "📊 Preserving history for trends..."
            mkdir -p allure-report/history
            cp -r gh-pages-content/history/* allure-report/history/ 2>/dev/null || true
            echo "History preserved"
          else
            echo "📈 No previous history found"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
